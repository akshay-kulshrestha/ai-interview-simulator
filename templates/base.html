<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Interview Simulator{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%232563eb'/><stop offset='1' stop-color='%2306b6d4'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><path d='M28 55 L45 38 L58 52 L74 30' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('home') }}">
            <span class="brand-mark"><i data-lucide="brain-circuit" class="icon" style="width:19px;height:19px;color:#fff;"></i></span>
            <span class="brand-text-block">
                <span class="b1">AI Interview</span>
                <span class="b2 gradient-text">Simulator</span>
            </span>
        </a>
        <nav>
            {% if current_page != 'setup' %}
            <a href="{{ url_for('home') }}">
                <i data-lucide="house" class="icon" style="width:16px;height:16px;"></i>
                <span>Home</span>
            </a>
            {% endif %}
            <a href="{{ url_for('history_page') }}" class="{{ 'active' if current_page == 'history' else '' }}">
                <i data-lucide="clock" class="icon" style="width:16px;height:16px;"></i>
                <span>History</span>
            </a>
        </nav>
    </header>
    <main class="container{{ ' wide' if current_page == 'report' else '' }}">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">AI Interview Simulator &middot; Practice mock interviews with instant AI feedback</footer>
    {% block scripts %}{% endblock %}
    <script>
        if (window.lucide) { lucide.createIcons(); }
    </script>
</body>
</html>
